name: Refresh search and deploy Pages

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current CoMPhy search database
        run: |
          search_root="$(mktemp -d)"
          trap 'rm -rf "$search_root"' EXIT
          git clone --depth=1 \
            "https://github.com/${GITHUB_REPOSITORY_OWNER}/comphy-search.git" \
            "$search_root/repository"
          install -m 0644 "$search_root/repository/search_db.json" \
            .github/docs/assets/js/search_db.json

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
