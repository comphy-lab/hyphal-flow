name: Refresh search and deploy Pages

on:
  schedule:
    - cron: '23 5 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch and validate the reviewed search index
        env:
          SEARCH_REVISION: ${{ vars.COMPHY_SEARCH_REVISION }}
          INDEX_DESTINATION: .github/docs/assets/js/search_db.json
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SEARCH_REVISION" ]]; then
            printf '%s\n' 'No reviewed COMPHY_SEARCH_REVISION is configured; deploying the committed index.'
            exit 0
          fi
          [[ "$SEARCH_REVISION" =~ ^[0-9a-f]{40}$ ]]
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          git -C "$tmp" init -q
          git -C "$tmp" fetch --depth=1 --no-tags https://github.com/comphy-lab/comphy-search.git "$SEARCH_REVISION"
          [[ "$(git -C "$tmp" rev-parse FETCH_HEAD)" == "$SEARCH_REVISION" ]]
          read -r mode kind object path <<< "$(git -C "$tmp" ls-tree "$SEARCH_REVISION" -- search_db.json)"
          [[ "$mode" == 100644 && "$kind" == blob && "$path" == search_db.json ]]
          # Read the blob, not a checked-out path that may be a symlink.
          git -C "$tmp" cat-file blob "$object" > "$tmp/search_db.json"
          python3 .github/scripts/validate-search-index.py "$tmp/search_db.json"
          install -m 0644 "$tmp/search_db.json" "$INDEX_DESTINATION"

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
